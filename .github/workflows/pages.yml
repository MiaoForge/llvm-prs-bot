name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot ID in the checked-in data/summary.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      EXPECTED_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            web/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --prefix pipeline
      # A production workflow can generate data/ from collected inputs here.
      # Manual dispatch currently publishes a selected checked-in snapshot.
      - name: Validate selected snapshot
        run: node pipeline/validate-snapshot.mjs data "$EXPECTED_SNAPSHOT_ID"
      - run: npm ci --prefix web
      - name: Build workbench
        run: npm --prefix web run build
        env:
          VITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Verify packaged snapshot
        run: node pipeline/validate-snapshot.mjs web/dist/data "$EXPECTED_SNAPSHOT_ID"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
